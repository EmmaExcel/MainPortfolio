    <!-- Fixed Background Shader -->
    <div class="fixed inset-0 z-[-1] pointer-events-none">
      <div class="absolute inset-0 w-full h-full opacity-60" style="display:block;">
        <canvas id="shader-canvas-ANIMATION_10" style="display:block;width:100%;height:100%"></canvas>
        <script>
        (function() {
          const canvas = document.getElementById('shader-canvas-ANIMATION_10');
          function syncSize() {
            const w = canvas.clientWidth  || window.innerWidth;
            const h = canvas.clientHeight || window.innerHeight;
            if (canvas.width !== w || canvas.height !== h) {
              canvas.width  = w;
              canvas.height = h;
            }
          }
          if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(syncSize).observe(canvas);
          }
          syncSize();

          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (!gl) return;
          const vs = `attribute vec2 a_position;
        varying vec2 v_texCoord;
        void main() {
          v_texCoord = a_position * 0.5 + 0.5;
          gl_Position = vec4(a_position, 0.0, 1.0);
        }`;
          const fs = `precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        varying vec2 v_texCoord;

        void main() {
            vec2 uv = v_texCoord;
            float t = u_time * 0.2;
            
            // Create organic, liquid-like motion using nested sine waves
            for(float i = 1.0; i < 4.0; i++) {
                uv.x += sin(uv.y * 3.0 * i + t) * 0.15 / i;
                uv.y += cos(uv.x * 3.0 * i + t) * 0.15 / i;
            }
            
            // Liquid metal color palette: Deep obsidian to chrome
            vec3 baseColor = vec3(0.02, 0.02, 0.03); // Deepest black
            float highlight = smoothstep(0.4, 0.6, sin(uv.x * 5.0 + uv.y * 2.0));
            vec3 liquidColor = mix(baseColor, vec3(0.15, 0.16, 0.18), highlight);
            
            // Add a "shimmer" effect
            float shimmer = pow(abs(sin(uv.x * 10.0 + t * 2.0)), 20.0) * 0.05;
            liquidColor += shimmer;
            
            gl_FragColor = vec4(liquidColor, 1.0);
        }`;
          function cs(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
          }
          const prog = gl.createProgram();
          gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
          gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(prog);
          gl.useProgram(prog);
          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
          const pos = gl.getAttribLocation(prog, 'a_position');
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          const uTime = gl.getUniformLocation(prog, 'u_time');
          const uRes = gl.getUniformLocation(prog, 'u_resolution');
          const uMouse = gl.getUniformLocation(prog, 'u_mouse');

          let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
          let rect = canvas.getBoundingClientRect();
          window.addEventListener('resize', () => { rect = canvas.getBoundingClientRect(); });
          window.addEventListener('mousemove', (event) => {
            if (rect.width && rect.height) {
              const nx = (event.clientX - rect.left) / rect.width;
              const ny = 1.0 - (event.clientY - rect.top) / rect.height;
              mouse.x = nx * canvas.width;
              mouse.y = ny * canvas.height;
            }
          });

          function render(t) {
            if (typeof ResizeObserver === 'undefined') syncSize();
            gl.viewport(0, 0, canvas.width, canvas.height);
            if (uTime) gl.uniform1f(uTime, t * 0.001);
            if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
            if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
          }
          render(0);
        })();
        </script>
      </div>

    <script>
        // Smooth Scroll Reveal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            const observeElements = () => {
              document.querySelectorAll('.fade-in-up').forEach(el => {
                  observer.observe(el);
              });
            };
            
            observeElements();
            
            // Re-run observer when React mutates DOM
            const mainObserver = new MutationObserver((mutations) => {
                observeElements();
            });
            mainObserver.observe(document.body, { childList: true, subtree: true });

            // Custom Cursor Logic
            const cursor = document.getElementById('custom-cursor');
            if (cursor && window.innerWidth >= 768) {
                // Initialize position off-screen or center
                cursor.style.transform = `translate3d(-100px, -100px, 0) translate(-50%, -50%)`;
                document.addEventListener('mousemove', (e) => {
                    cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
                });
            }
        });
